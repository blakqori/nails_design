<!doctype html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin Login | Nails Design</title>

    <link rel="stylesheet" href="login.css" />
    <script src="login.js" defer></script>
  </head>

  <body>
    <main class="login-page">
      <section class="login-card">
        <div class="login-header">
          <h1>Nails Design</h1>
          <p>Paneli i Administrimit</p>
        </div>

        <form id="login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="username"
              placeholder="Shkruani email-in"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Fjalëkalimi</label>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              placeholder="Shkruani fjalëkalimin"
              required
            />
          </div>

          <p id="login-message" role="alert"></p>

          <button type="submit" id="login-button">Kyçu</button>
        </form>

        <p class="login-footer">Qasje vetëm për administratorin.</p>
      </section>
    </main>
    <script src="login.js" defer></script>
  </body>
</html>
